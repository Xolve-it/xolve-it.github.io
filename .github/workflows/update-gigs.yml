# Refreshes the AI Gigs page (gigs/gigs.json) every 8 hours.
# Cloudflare Pages and GitHub Pages republish automatically after the commit.
# Run it by hand from GitHub: Actions → "Update AI gigs" → Run workflow.
name: Update AI gigs

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gigs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the latest roles
        run: python scripts/update_gigs.py
      - name: Commit the new list
        run: |
          if git diff --quiet -- gigs/gigs.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gigs/gigs.json
          git commit -m "Update AI gigs"
          git push
